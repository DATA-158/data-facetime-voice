name: web-local
version: 1.0.0
description: "Local, in-process page extraction: fetch with httpx, strip to text with the stdlib HTML parser. No service, no resident memory, nothing leaves the machine except the page request itself. Replaces the self-hosted Firecrawl stack (1.7 GB resident) on DATA's 8 GB Mac."
author: DATA
kind: backend
provides_web_providers:
  - local
